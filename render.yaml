services:
  - type: web
    name: shunshou-campus-delivery
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build && npm run db:push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 粘贴 Neon 免费数据库的连接串（形如 postgresql://user:pass@ep-xxx.aws.neon.tech/neondb?sslmode=require）
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      # 部署完成后填 Render 给你的域名，例如 https://shunshou-campus-delivery.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # 前后端同域部署，留空即可
      - key: VITE_API_BASE_URL
        value: ""
      - key: SEED_ADMIN_USERNAME
        value: xushenxin050831
      - key: SEED_ADMIN_PASSWORD
        sync: false
