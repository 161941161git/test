services:
  - type: web
    name: shunshou-campus-delivery
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shunshou-db
          property: connectionString
      - key: DATABASE_SSL
        value: true
      - key: DATABASE_POOL_MAX
        value: 5
      # 部署完成后把这里换成你的服务地址，例如 https://shunshou-campus-delivery.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # 前端请求后端的地址，通常与 PUBLIC_BASE_URL 一致
      - key: VITE_API_BASE_URL
        sync: false
      - key: SEED_ADMIN_USERNAME
        value: xushenxin050831
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: shunshou-db
    plan: free
    region: singapore
    databaseName: shunshou
    user: shunshou
